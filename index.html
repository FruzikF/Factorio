<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моделирование систем | Личный кабинет</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #222; font-family: sans-serif; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; background: #2c3e50; color: white; padding: 10px; text-align: center; z-index: 10; font-size: 14px; }
        #game-frame { width: 100%; height: 100%; border: none; margin-top: 40px; }
        .loading { color: white; text-align: center; margin-top: 200px; }
    </style>
</head>
<body>

<div class="overlay">
    Платформа Электронного Обучения: Модуль "Логистика и Автоматизация" (8 класс)
</div>

<iframe id="game-frame" src="https://wasm.v8.gl/?url=https://drive.google.com/uc?export=download&id=1ePhxxSGH6h7gKIasVY59eahKAZZ2HQBm" allow="fullscreen"></iframe>

<div class="loading" id="load-text">Подготовка виртуальной среды... (может занять 2-5 минут)</div>

<script>
    // Скрываем надпись загрузки через некоторое время
    setTimeout(() => {
        document.getElementById('load-text').style.display = 'none';
    }, 10000);
</script>

</body>
</html>
