<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет | Образовательный портал</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; }
        #portal-ui { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; color: #333; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 450px; }
        .btn { background: #4a90e2; color: white; border: none; padding: 18px 40px; border-radius: 10px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #357abd; transform: translateY(-2px); }
        #game-container { display: none; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
        .header-top { position: absolute; top: 0; width: 100%; background: #2c3e50; color: white; padding: 10px 20px; font-size: 14px; text-align: left; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="header-top">Система дистанционного обучения v4.2 | FruzikF_8B</div>

<div id="portal-ui">
    <div class="card">
        <h2>Практическая работа №5</h2>
        <p>Тема: "Моделирование логистических систем".<br>Нажмите для инициализации виртуальной среды.</p>
        <button class="btn" onclick="startEmulator()">ЗАПУСТИТЬ СРЕДУ</button>
    </div>
</div>

<div id="game-container">
    <iframe id="emulator-frame" allow="fullscreen; keyboard; mouse;"></iframe>
</div>

<script>
    function startEmulator() {
        const ui = document.getElementById('portal-ui');
        const container = document.getElementById('game-container');
        const frame = document.getElementById('emulator-frame');

        // Твоя ПРЯМАЯ ссылка на ZIP-архив с Google Диска
        const zipUrl = 'https://drive.google.com/uc?export=download&id=1ePhxxSGH6h7gKIasVY59eahKAZZ2HQBm';
        
        // Используем только официальный домен WebVM.io (он самый надежный)
        // Аргумент exec указывает путь к файлу внутри твоего архива
        const webVmUrl = 'https://webvm.io/?display=1&url=' + encodeURIComponent(zipUrl);

        ui.style.display = 'none';
        container.style.display = 'block';
        
        // Загружаем эмулятор
        frame.src = webVmUrl;
    }
</script>

</body>
</html>
