<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учебный портал | Личный кабинет</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        #portal-ui { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .btn { background: #4a90e2; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        #game-container { display: none; width: 100%; height: 100%; background: black; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="portal-ui">
    <div class="card">
        <h2>Практическая работа №5</h2>
        <p>Тема: "Автоматизация и логистика".<br>Нажмите кнопку для запуска симулятора среды.</p>
        <button class="btn" onclick="startEmulator()">Запустить симулятор</button>
    </div>
</div>

<div id="game-container">
    <iframe id="emulator-frame" allow="fullscreen"></iframe>
</div>

<script>
    function startEmulator() {
        const ui = document.getElementById('portal-ui');
        const container = document.getElementById('game-container');
        const frame = document.getElementById('emulator-frame');

        // Твоя ПРЯМАЯ ссылка на Google Диск
        const zipUrl = 'https://drive.google.com/uc?export=download&id=1ePhxxSGH6h7gKIasVY59eahKAZZ2HQBm';
        
        // Настройка WebVM:
        // url = ссылка на твой архив
        // exec = путь к запускаемому файлу внутри архива
        const webVmUrl = 'https://webvm.io/?display=1&url=' + encodeURIComponent(zipUrl) + '&exec=/factorio/bin/x64/factorio';

        // Прячем сайт, показываем эмулятор
        ui.style.display = 'none';
        container.style.display = 'block';
        
        // Загружаем эмулятор в iframe
        frame.src = webVmUrl;
    }
</script>

</body>
</html>
